# Configuración del sitio
title: Suzuano - Security Researcher
description: Personal blog about hacking, cybersecurity, penetration testing, CTF writeups, malware analysis, and reverse engineering. Compartiendo conocimientos de seguridad informática.
baseurl: ""
url: "https://suzunao.github.io"
timezone: UTC

# Autor del sitio
author:
  name: Suzunao
  bio: Security Researcher | Pentester | CTF Player
  github: suzunao
  twitter: llSuzunaoll
  linkedin: wuillian-rosales
  tryhackme: suzunao
  hackthebox: 1548247

# Redes sociales
social:
  name: Suzuano
  links:
    - https://github.com/suzunao
    - https://twitter.com/llSuzunaoll
    - https://www.linkedin.com/in/wuillian-rosales/

# Configuración de Markdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  toc_levels: 1..6
  syntax_highlighter: rouge

# Configuración de Sass
sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never

# Permalinks
permalink: /post/:title/

# Configuración de jekyll-seo-tag (única fuente de meta tags SEO/OG/Twitter)
locale: es_ES
twitter:
  username: llSuzunaoll
  card: summary_large_image
logo: /assets/img/optimized/brand-512.webp

# Plugins de Jekyll
plugins:
  - jekyll-archives
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-compose

# Archivos por etiquetas
jekyll-archives:
  enabled:
    - tags
  layouts:
    tag: default
  permalinks:
    tag: '/tag/:name/'

# Búsqueda
search_enabled: true

# Feed RSS
feed:
  path: feed.xml

# Sitemap
sitemap:
  filename: sitemap.xml

# Número de posts recientes que se muestran en la home
home_post_limit: 6

# Excluir el directorio gaby completo (no publicar en el sitio)
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - vendor
  - .vscode
  - .idea
  - "*.psd"
  - "*.ai"
  - node_modules
  - package.json
  - package-lock.json
  - gaby

# Categorías y etiquetas por defecto
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      share: true
      image:
        path: /assets/img/optimized/brand-1200x630.webp
        height: 567
        width: 1080
